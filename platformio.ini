; SRFM - custom 4-channel pneumatic valve controller PCB
; Seeed XIAO nRF52840 + AD5724R (SPI DAC) + ADS1015 (I2C ADC) + TPS26600 eFuse.
; See FIRMWARE_HANDOFF.md for the pin map, register sequences and safety rules,
; and PROTOCOL.md for the host command set.
;
; The XIAO is not a stock PlatformIO board: boards/xiao_nrf52840.json plus the
; pin-map variant in variants/ describe it on top of the Adafruit nRF52 core.
; The XIAO bootloader carries SoftDevice S140 7.3.0 (application starts at
; 0x27000); the PlatformIO core package only ships the 6.1.1 API headers and a
; v6 linker script, so the board JSON uses those headers (the SoC calls are
; identical) together with linker/nrf52840_s140_v7.ld from this repo.
; sd_fwid 0x0123 in the JSON is what adafruit-nrfutil checks at upload time.

[env:xiao_nrf52840]
platform = nordicnrf52@~10.9.0
board = xiao_nrf52840
framework = arduino
monitor_speed = 115200
; `pio run -t upload` uses adafruit-nrfutil serial DFU through the stock
; bootloader (1200-baud touch). Fallback: double-tap reset and copy a UF2 -
; see README.md.
upload_protocol = nrfutil
