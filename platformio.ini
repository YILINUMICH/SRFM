; SRFM - custom 4-channel pneumatic valve controller PCB
; Seeed XIAO nRF52840 + AD5724R (SPI DAC) + ADS1015 (I2C ADC) + TPS26600 eFuse.
; See docs/FIRMWARE_HANDOFF.md for the pin map, register sequences and safety
; rules, and docs/PROTOCOL.md for the host command set.
;
; The XIAO is not a stock PlatformIO board: firmware/boards/xiao_nrf52840.json
; plus the pin-map variant in firmware/variants/ describe it on top of the
; Adafruit nRF52 core. The XIAO bootloader carries SoftDevice S140 7.3.0
; (application starts at 0x27000); the PlatformIO core package only ships the
; 6.1.1 API headers and a v6 linker script, so the board JSON uses those
; headers (the SoC calls are identical) together with
; firmware/linker/nrf52840_s140_v7.ld from this repo. sd_fwid 0x0123 in the
; JSON is what adafruit-nrfutil checks at upload time.

; Everything firmware lives under firmware/; this file stays at the root so
; `pio run` works from a checkout without a cd.
[platformio]
src_dir = firmware/src
lib_dir = firmware/lib
boards_dir = firmware/boards

[env:xiao_nrf52840]
platform = nordicnrf52@~10.9.0
board = xiao_nrf52840
framework = arduino
monitor_speed = 115200
; `pio run -t upload` uses adafruit-nrfutil serial DFU through the stock
; bootloader (1200-baud touch). Fallback: double-tap reset and copy a UF2 -
; see README.md.
upload_protocol = nrfutil
; Route the core's 1200-baud DFU entry through the firmware (see main.cpp:
; the watchdog would otherwise cut the serial DFU short).
build_flags = -Wl,--wrap=enterSerialDfu
; Upload: firmware/tools/upload_dfu.py asks the running firmware to enter the
; bootloader (DFU command), waits for the bootloader's port and hands it to
; adafruit-nrfutil. PlatformIO's own 1200-baud touch is disabled because the
; watchdog makes its timing unreliable (see main.cpp). Add --upload-port only
; to force a port; the script finds the board by USB VID 0x2886 otherwise.
extra_scripts = firmware/tools/upload_dfu.py
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
